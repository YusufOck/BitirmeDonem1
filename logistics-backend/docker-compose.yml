name: sbtu-logistics

services:
  backend:
    build: .
    container_name: sbtu_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - sbtu_net

  frontend:
    build:
      context: ../logistics-frontend
    container_name: sbtu_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/ws/simulation
    env_file:
      - ../logistics-frontend/.env
    depends_on:
      - backend
    networks:
      - sbtu_net

  redis:
    image: redis:7-alpine
    container_name: sbtu_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sbtu_net

  ollama:
    image: ollama/ollama
    container_name: sbtu_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - sbtu_net

  ollama-model:
    image: ollama/ollama
    container_name: sbtu_ollama_model
    environment:
      OLLAMA_HOST: http://ollama:11434
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until ollama list >/dev/null 2>&1; do sleep 2; done;
      ollama pull ${OLLAMA_MODEL:-llama3.2}"
    depends_on:
      - ollama
    networks:
      - sbtu_net

  postgres:
    image: postgres:16-alpine
    container_name: sbtu_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sbtu_net

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  sbtu_net:
    driver: bridge
